<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(120vmin 80vmin at 30% -10%, rgba(45, 212, 191, .16), transparent 60%),
      linear-gradient(180deg, #10161f, #0a0f18 92%);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .glyph {
    display: grid;
    place-items: center;
    width: 62%;
    height: 62%;
    border-radius: 18%;
    background: linear-gradient(135deg, rgba(45, 212, 191, .14), rgba(45, 212, 191, .03));
    box-shadow: inset 0 0 0 2px rgba(45, 212, 191, .35);
    color: #2dd4bf;
    font-size: 34vmin;
    font-weight: 700;
    line-height: 1;
  }
</style>
</head>
<body><div class="glyph">工</div></body>
</html>
