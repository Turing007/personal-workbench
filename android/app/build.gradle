plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.workbench.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workbench.app'
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName '1.19'
    }

    signingConfigs {
        release {
            // 签名材料不进仓库：本机放在 android/keystore.properties（已忽略）。
            storeFile rootProject.file(keystoreProperties.getProperty('storeFile', 'workbench.keystore'))
            storePassword keystoreProperties.getProperty('storePassword', '')
            keyAlias keystoreProperties.getProperty('keyAlias', 'workbench')
            keyPassword keystoreProperties.getProperty('keyPassword', keystoreProperties.getProperty('storePassword', ''))
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 扫码：不依赖 Google Play 服务，国产手机可直接使用。
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
