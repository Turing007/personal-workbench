plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbench.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workbench.app'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.18'
    }

    signingConfigs {
        release {
            // 个人项目：keystore 随仓库保存，保证换电脑重新打包后签名不变、可覆盖安装。
            storeFile rootProject.file('workbench.keystore')
            storePassword 'REDACTED'
            keyAlias 'workbench'
            keyPassword 'REDACTED'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 扫码：不依赖 Google Play 服务，国产手机可直接使用。
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
