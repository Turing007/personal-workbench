services:
  workbench:
    build: .
    image: personal-workbench:latest
    restart: unless-stopped
    environment:
      - WORKBENCH_TRUST_PROXY=1
      # 如需改端口/数据目录，在服务器上的 .env 里配置对应的 WORKBENCH_* 变量。
    volumes:
      - workbench-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - WORKBENCH_DOMAIN=${WORKBENCH_DOMAIN:?请在 .env 中设置 WORKBENCH_DOMAIN，例如 1-2-3-4.sslip.io}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - workbench

volumes:
  workbench-data:
  caddy-data:
  caddy-config:
