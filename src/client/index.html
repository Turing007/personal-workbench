<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 是给报价表这类窄表格用的：iOS Safari 只在「聚焦的输入框字号 < 16px」时
         才强制放大整页，字号降到 13px 就必须同时关掉这个自动缩放，否则一点输入框页面就糊上来。
         代价是全站失去双指缩放。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>个人工作台</title>
    <meta name="description" content="报价、开单、订单、发货与财务一体的个人业务工作台" />
    <meta name="theme-color" content="#0e7368" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="工作台" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
